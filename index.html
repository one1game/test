<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>One1Game — тестовая страница</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2450 0%, #0b0f1e 60%, #070a14 100%);
    color: #e8ecf7;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 560px; text-align: center;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px; padding: 42px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 12px; font-size: clamp(26px, 6vw, 38px); letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: #aab3cc; }
  a {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #4f7cff; color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { background: #3f68e6; }
</style>
</head>
<body>
  <main class="card">
    <h1>Привет!</h1>
    <p>Тестовая страница <strong>One1Game</strong> работает.</p>
    <a href="https://one1game.org/">Перейти на one1game.org</a>
  </main>
</body>
</html>
